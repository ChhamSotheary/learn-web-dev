<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center" style="color: blue; font-size: 30px; font-family: Arial; margin-bottom: 10px;">Student Registration Form</h1>
    <p align="center" >Please complete all required fields.</p>
    <form action="" style="width: 500px; margin: auto;" >
        <fieldset>
            <legend>Personal Information</legend>
            <div>
                <label for="fullname">Full Name:</label>
                <input type="text" placeholder="Enter your full name" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="username">Username:</label>
                <input type="text" placeholder="Enter your username" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="email">Email Address:</label>
                <input type="email" placeholder="example@gmail.com" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="age">Age:</label>
                <input type="number" placeholder="Enter your age" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="Phonenumber">Phone Number:</label>
                <input type="tel" placeholder="0123456789" style="width: 75%; padding: 11px; box-sizing: border-box;">
            </div>
        </fieldset>
        <fieldset>
            <legend>Account Information</legend>
            <div>
                <label for="studentid">Student ID:</label>
                <input type="text" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="password">Password:</label>
                <input type="password" placeholder="Enter your password" style="width: 75%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="confirmpassword">Confirm Password:</label>
                <input type="password" placeholder="Confirm your password" style="width: 65%; padding: 11px; box-sizing: border-box;">
            </div>
        </fieldset>
        <fieldset>
            <legend>Emergency Contact</legend>
            <div>
                <label for="emergencycontactname">Emergency Contact Name:</label>
                <input type="text" placeholder="Enter emergency contact name" style="width: 55%; padding: 11px; box-sizing: border-box;"><br><br>
                <label for="emergencycontactemail">Emergency Contact Email:</label>
                <input type="email" placeholder="emergency@gmail.com" style="width: 55%; padding: 11px; box-sizing: border-box;">
            </div>
        </fieldset><br>
        <button type="submit" style="background-color: blue; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px;">Register</button>
        <button type="reset" style="background-color: red; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; margin-left: 10px;">Reset Form</button>
    </form>
</body>
</html>
