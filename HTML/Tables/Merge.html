<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>
</head>
<body>

    <h2>Product Information</h2>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>No</th>
            <th>Product</th>
            <th>Price</th>
            <th>Remark</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Apple</td>
            <td>$2</td>
            <td rowspan="2">Available</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Banana</td>
            <td>$1</td>
            <!-- <td>Available</td> -->
        </tr>

        <tr>
            <td>3</td>
            <td>Mango</td>
            <td>$3</td>
            <td>Out of Stock</td>
        </tr>
        <tr>
            <th colspan="4">Total Product : 2</th>
        </tr>
    </table>
</body>
</html>
